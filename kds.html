<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cozinha">
<meta name="theme-color" content="#0c0e13">
<link rel="manifest" href="kds.webmanifest">
<title>Cozinha Xis da Gaúcha</title>
<style>
:root{ --g:#159165; --y:#f2b705; --r:#d32f2f; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:#0c0e13; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; cursor:none; overflow:hidden; }
.bar{ display:flex; align-items:center; justify-content:space-between; padding:10px 18px; background:#12151c; border-bottom:1px solid #2a2e39; height:52px; }
.bar h1{ margin:0; font-size:20px; font-weight:800; }
.bar .meta{ font-size:18px; font-weight:700; color:#9aa0ae; display:flex; gap:22px; align-items:center; }
.dot{ width:10px; height:10px; border-radius:50%; background:#6b7280; display:inline-block; margin-right:8px; }
.dot.on{ background:var(--g); }
.wrap{ height:calc(100% - 52px); overflow:hidden; padding:14px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--w,260px),1fr)); gap:14px; align-content:start; }
.t{ text-align:center; padding:14px 10px 16px; background:var(--c) !important; color:var(--tc,#fff); border:none !important; }
.t-big{ font-size:clamp(44px,6vw,96px); font-weight:800; line-height:1; }
.t-big small{ display:block; font-size:.28em; letter-spacing:.12em; opacity:.85; margin-bottom:4px; }
.t .tag{ display:block; width:max-content; margin:10px auto 0; font-size:clamp(14px,1.6vw,24px); padding:3px 14px; }
.t-mesa{ font-size:clamp(20px,2.4vw,38px); font-weight:800; opacity:.9; margin-top:4px; }
.t-time{ font-size:clamp(40px,5.4vw,84px); font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05; margin-top:10px; background:rgba(0,0,0,.28); border-radius:12px; padding:6px 0; color:#fff; }
.t{ background:#171a21; border-radius:16px; overflow:hidden; border:3px solid var(--c); display:flex; flex-direction:column; }
.t-head{ background:var(--c); color:var(--tc,#fff); padding:8px 14px; display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.t-time{ font-size:clamp(34px,4.2vw,64px); font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05; }
.t-who{ font-size:clamp(16px,1.7vw,26px); font-weight:800; text-align:right; }
.t-who small{ display:block; font-size:.7em; font-weight:700; opacity:.85; }
.t-body{ padding:10px 14px 14px; }
.it{ margin-bottom:10px; }
.it-main{ font-size:clamp(20px,2.2vw,34px); font-weight:800; line-height:1.15; }
.it-main b{ color:var(--c); }
.it-sub{ font-size:clamp(14px,1.5vw,22px); font-weight:700; color:#c9cdd6; margin-top:2px; }
.it-obs{ font-size:clamp(15px,1.6vw,24px); font-weight:800; color:#ffd24d; margin-top:2px; }
.tag{ display:inline-block; font-size:.55em; font-weight:800; padding:2px 8px; border-radius:8px; background:#2563a8; margin-left:8px; vertical-align:middle; }
.tag.ed{ background:var(--y); color:#1a1400; }
.empty{ text-align:center; margin-top:18vh; font-size:clamp(24px,3vw,44px); font-weight:800; color:#3a3f4d; }
.err{ position:fixed; left:0; right:0; bottom:0; background:#d32f2f; padding:10px 16px; font-weight:700; display:none; }
</style>
</head>
<body>
<div class="bar"><h1 id="title">Cozinha</h1><div class="meta"><span id="count"></span><span><span class="dot" id="dot"></span><span id="clock"></span></span></div></div>
<div class="wrap"><div class="grid" id="grid"></div><div class="empty" id="empty">Sem pedidos 👌</div></div>
<div class="err" id="err"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
var $ = function(id){ return document.getElementById(id); };
var cfg = { amberMin: 8, redMin: 14, hideMin: 180, kitchenPrinters: ['POS'] };
var skewBy = {}; try{ skewBy = JSON.parse(localStorage.getItem('xg_skew') || '{}') || {}; }catch(e){}
function effAt(o){ var t = o.at + (skewBy[o.deviceId || o.origin || 'x'] || 0); return t > Date.now() ? Date.now() : t; }
var orders = [], ordersMain = [], ordersManual = [], nomeLoja = '';
var loja = 'barreiros';
try{ loja = new URLSearchParams(location.search).get('loja') || 'barreiros'; }catch(e){}
function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function fmt(ms){ var s = Math.max(0, Math.floor(ms/1000)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function band(ms){ var m = ms/60000; return m < cfg.amberMin ? 'g' : (m < cfg.redMin ? 'y' : 'r'); }
function optLine(o){ if(typeof o === 'string') return o; if(o.kind === 'remove') return 'SEM ' + o.name; return (o.kind === 'choice' ? '' : '+ ') + ((o.qty||1) > 1 ? o.qty + 'x ' : '') + o.name; }
function items(o){ return (o.items||[]).filter(function(i){ return !i.canceled && cfg.kitchenPrinters.indexOf(i.printer || 'POS') >= 0; }); }
function render(){
  var now = Date.now(), lim = now - cfg.hideMin*60000;
  var list = orders.filter(function(o){ return !o.dispatchedAt && effAt(o) >= lim && (o.loja || 'barreiros') === loja && items(o).length; }).sort(function(a,b){ return effAt(a) - effAt(b); });
  $('count').textContent = list.length + (list.length === 1 ? ' pedido' : ' pedidos');
  $('empty').style.display = list.length ? 'none' : 'block';
  var n = list.length; document.documentElement.style.setProperty('--w', (n > 12 ? 190 : n > 6 ? 230 : 280) + 'px');
  $('grid').innerHTML = list.map(function(o){
    var ms = now - effAt(o), b = band(ms), col = b === 'g' ? 'var(--g)' : b === 'y' ? 'var(--y)' : 'var(--r)', tc = b === 'y' ? '#1a1400' : '#fff';
    var ed = (o.items||[]).reduce(function(m,i){ return Math.max(m, i.editedAt||0); }, 0), edTag = ed && now - ed < 10*60000 ? '<span class="tag ed">EDITADO</span>' : '';
    return '<div class="t" style="--c:' + col + ';--tc:' + tc + '"><div class="t-big">' + (o.fonte === 'ifood' ? '<small>IFOOD</small>' + esc(o.numero) : o.fonte === 'anotaai' ? '<small>ANOTA AÍ</small>' + esc(o.numero) : (o.comanda || o.numero) ? '<small>COMANDA</small>' + esc(o.comanda || o.numero) : '<small>PEDIDO</small>') + '</div>' + (o.mesa ? '<div class="t-mesa">Mesa ' + esc(o.mesa) + '</div>' : '') + '<div class="t-time">' + fmt(ms) + '</div>' + edTag + '</div>';
  }).join('');
  var d = new Date(); $('clock').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function err(m){ var e = $('err'); e.textContent = m; e.style.display = m ? 'block' : 'none'; }
(function(){
  $('title').textContent = 'Cozinha · ' + (loja === 'barreiros' ? 'São José' : loja === 'palhoca' ? 'Palhoça' : loja);
  setInterval(render, 1000); render();
  try{ if(navigator.wakeLock){ var wl = function(){ navigator.wakeLock.request('screen').catch(function(){}); }; wl(); document.addEventListener('visibilitychange', function(){ if(!document.hidden) wl(); }); } }catch(e){}
  if(!window.FIREBASE_CONFIG){ err('config.js não encontrado — coloque este arquivo na mesma pasta do Pedido X.'); return; }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  var db = firebase.firestore(), auth = firebase.auth(), started = false;
  auth.onAuthStateChanged(function(u){
    if(!u){ auth.signInAnonymously().catch(function(e){ err('Login falhou: ' + e.message); }); return; }
    if(started) return; started = true;
    var first = true;
    db.collection('orders').where('at','>=', Date.now() - 36*3600*1000).onSnapshot(function(s){
      if(!first){ s.docChanges().forEach(function(ch){
        if(ch.type !== 'added' || ch.doc.metadata.hasPendingWrites || ch.doc.metadata.fromCache) return;
        var d = ch.doc.data(), k = d.deviceId || d.origin || 'x', diff = Date.now() - d.at;
        skewBy[k] = Math.abs(diff) > 20000 ? diff - 1000 : 0; try{ localStorage.setItem('xg_skew', JSON.stringify(skewBy)); }catch(e){}
      }); }
      first = false;
      ordersMain = s.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); }); orders = ordersMain.concat(ordersManual);
      $('dot').classList.add('on'); err(''); render();
    }, function(e){ $('dot').classList.remove('on'); err('Sem acesso aos pedidos: ' + e.message); });
    db.collection('painelPedidos').where('at','>=', Date.now() - 36*3600*1000).onSnapshot(function(s){
      ordersManual = s.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); }); orders = ordersMain.concat(ordersManual); render();
    }, function(){});
    db.collection('settings').doc('painel').onSnapshot(function(d){
      if(!d.exists) return; var s = d.data();
      if(s.amberMin>0) cfg.amberMin = s.amberMin; if(s.redMin>0) cfg.redMin = s.redMin; if(s.hideMin>=30) cfg.hideMin = s.hideMin;
      if(Array.isArray(s.kitchenPrinters) && s.kitchenPrinters.length) cfg.kitchenPrinters = s.kitchenPrinters; render();
    }, function(){});
  });
})();
</script>
</body>
</html>
