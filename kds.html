<style>
:root{ --g:#159165; --y:#f2b705; --r:#d32f2f; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:#0c0e13; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; cursor:none; overflow:hidden; }
.bar{ display:flex; align-items:center; justify-content:space-between; padding:10px 18px; background:#12151c; border-bottom:1px solid #2a2e39; height:52px; }
.bar h1{ margin:0; font-size:20px; font-weight:800; }
.bar .meta{ font-size:18px; font-weight:700; color:#9aa0ae; display:flex; gap:22px; align-items:center; }
.dot{ width:10px; height:10px; border-radius:50%; background:#6b7280; display:inline-block; margin-right:8px; }
.dot.on{ background:var(--g); }
.wrap{ height:calc(100% - 52px); overflow:hidden; padding:14px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--w,260px),1fr)); gap:14px; align-content:start; }
.t{ text-align:center; padding:14px 10px 16px; background:var(--c) !important; color:var(--tc,#fff); border:none !important; }
.t-big{ font-size:clamp(44px,6vw,96px); font-weight:800; line-height:1; }
.t-big small{ display:block; font-size:.28em; letter-spacing:.12em; opacity:.85; margin-bottom:4px; }
.t .tag{ display:block; width:max-content; margin:10px auto 0; font-size:clamp(14px,1.6vw,24px); padding:3px 14px; }
.t-mesa{ font-size:clamp(20px,2.4vw,38px); font-weight:800; opacity:.9; margin-top:4px; }
.t-time{ font-size:clamp(40px,5.4vw,84px); font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05; margin-top:10px; background:rgba(0,0,0,.28); border-radius:12px; padding:6px 0; color:#fff; }
.t{ background:#171a21; border-radius:16px; overflow:hidden; border:3px solid var(--c); display:flex; flex-direction:column; }
.t-head{ background:var(--c); color:var(--tc,#fff); padding:8px 14px; display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.t-time{ font-size:clamp(34px,4.2vw,64px); font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05; }
.t-who{ font-size:clamp(16px,1.7vw,26px); font-weight:800; text-align:right; }
.t-who small{ display:block; font-size:.7em; font-weight:700; opacity:.85; }
.t-body{ padding:10px 14px 14px; }
.it{ margin-bottom:10px; }
.it-main{ font-size:clamp(20px,2.2vw,34px); font-weight:800; line-height:1.15; }
.it-main b{ color:var(--c); }
.it-sub{ font-size:clamp(14px,1.5vw,22px); font-weight:700; color:#c9cdd6; margin-top:2px; }
.it-obs{ font-size:clamp(15px,1.6vw,24px); font-weight:800; color:#ffd24d; margin-top:2px; }
.tag{ display:inline-block; font-size:.55em; font-weight:800; padding:2px 8px; border-radius:8px; background:#2563a8; margin-left:8px; vertical-align:middle; }
.tag.ed{ background:var(--y); color:#1a1400; }
.empty{ text-align:center; margin-top:18vh; font-size:clamp(24px,3vw,44px); font-weight:800; color:#3a3f4d; }
.err{ position:fixed; left:0; right:0; bottom:0; background:#d32f2f; padding:10px 16px; font-weight:700; display:none; }
</style>
</head>
